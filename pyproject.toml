[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "strainlink"
version = "0.1.0"
description = "Geotechnical DIC with sensor fusion and an evidence-based AI correlation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tifffile>=2024.1",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "pywebview>=5.0",
    "plotly>=5.0",
]

[project.scripts]
strainlink = "strainlink.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strainlink = ["app/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
